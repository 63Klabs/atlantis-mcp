# Atlantis for AWS SAM Deployments
# Atlantis MCP Server
# Author: 63klabs.net
# Version: v0.0.1/2026-02-24

# Documentation, Issues/Feature Requests, Latest Updates, and Security Reports on GitHub:
# https://github.com/63klabs/atlantis-mcp

# Creates an MCP (Model Context Protocol) server for Atlantis Templates and Scripts Platform
# Provides tools for template and starter code discovery and documentation
# This template is designed to be used with 63KLabs Atlantis for automated deployments.

# USE WITH:
# - atlantis/templates/v2/pipeline/template-pipeline.yml
# - atlantis/templates/v2/storage/template-storage-s3-oac-for-cloudfront.yml # (optional) for hosting documentation
# - atlantis/templates/v2/network/template-network-route53-cloudfront-s3-apigw.yml # (optional) for hosting documentation

AWSTemplateFormatVersion: "2010-09-09"
Transform:  AWS::Serverless-2016-10-31
Description: "Atlantis MCP Server - Model Context Protocol server for AI-assisted development"

# =============================================================================
# META DATA
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-interface.html
# 

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - 
        Label:
          default: "Application Resource Naming"
        Parameters:
          - Prefix
          - ProjectId
          - StageId
          - S3BucketNameOrgPrefix
          - RolePath
          - PermissionsBoundaryArn
          - ParameterStoreHierarchy
      -
        Label:
          default: "Deployment Environment Information"
        Parameters:
          - DeployEnvironment
          - DeployRole
          - FunctionGradualDeploymentType
          - AlarmNotificationEmail
      -
        Label:
          default: "Lambda Function Settings"
        Parameters:
          - FunctionTimeOutInSeconds
          - FunctionMaxMemoryInMB
          - FunctionArchitecture
      -
        Label:
          default: "Application Parameters"
        Parameters:
          - ApiPathBase
          - UserAgent
          - LogRetentionInDaysForPROD
          - LogRetentionInDaysForDEVTEST
          - ApiGatewayLoggingEnabled
      -
        Label:
          default: "MCP Server Configuration"
        Parameters:
          - AtlantisS3Buckets
          - AtlantisGitHubUserOrgs
          - ReadLambdaExecRoleIncludeManagedPolicyArns
      -
        Label:
          default: "Cache TTL Settings"
        Parameters:
          - CacheTTLFullTemplateContent
          - CacheTTLTemplateVersionHistory
          - CacheTTLTemplateUpdates
          - CacheTTLTemplateList
          - CacheTTLAppStarterList
          - CacheTTLGitHubRepoList
          - CacheTTLS3BucketList
          - CacheTTLNamespaceList
          - CacheTTLCategoryList
          - CacheTTLDocumentationIndex
      -
        Label:
          default: "Cache-Data Settings"
        Parameters:
          - CacheDataDynamoDbTableName
          - CacheDataS3BucketName
          - CacheDataTimeZoneForInterval
      -
        Label:
          default: "Documentation Indexer Settings"
        Parameters:
          - DocIndexScheduleForDEVTEST
          - DocIndexScheduleForPROD
      -
        Label:
          default: "Documentation AI (Semantic Search) Settings"
        Parameters:
          - EnableDocAi
          - DocAiMinTier
          - DocAiRetrievalMode
          - DocAiEmbeddingModel
          - DocAiEmbeddingDimensions
          - DocAiEmbeddingMaxInputTokens
          - DocAiAssistModel
          - DocAiAssistFoundationModel
          - DocAiAssistMaxCandidates
          - DocAiTopK
          - DocAiCandidateMultiplier
          - DocAiS3VectorBucket
          - DocAiS3VectorIndex
          - DocAiEmbeddingRegion
          - DocAiAssistProfileRegions

# =============================================================================
# PARAMETERS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/parameters-section-structure.html
#

Parameters:

  # ---------------------------------------------------------------------------
  # Application Resource Naming

  Prefix:
    Type: String
    Description: "Prefix pre-pended to all resources. This can be thought of as a Name Space used to identify ownership/access for teams, departments, etc. For example, resources named ws-* could belong to the web service team and could have IAM permissions to allow access to other ws-* resources. The Prefix must have a corresponding CloudFormation Service Role. Short, descriptive 2-6 character values work best. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: "acme" 
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  ProjectId:
    Type: String
    Description: "This is the Project or Application Identifier. If you receive 'S3 bucket name too long' errors during stack creation, then you must shorten the Project ID or use an S3 Org Prefix. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    AllowedPattern: "^[a-z][a-z0-9-]{0,24}[a-z0-9]$"
    MinLength: 2
    MaxLength: 26
    ConstraintDescription: "Minimum of 2 characters (suggested maximum of 20). Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  StageId:
    Type: String
    Description: "This is an alias for the branch. It does not need to match CodeCommitBranch or DeployEnvironment. Due to resource naming restrictions you can use this to provide shorter names without special characters that are allowed in branch names. For example if you have a 'test/feature-98' branch, you could use 'tf98' as the StageId. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number."

  S3BucketNameOrgPrefix:
    Type: String
    Description: "By default, to enforce uniqueness, buckets include account and region in the bucket name. However, due to character limits, you can specify your own S3 prefix (like an org code). This will be used in addition to the Prefix entered above. Note that this length is shared with the recommended length of 20 characters for Resource Identifiers. So if you have a 10 character S3BucketNameOrgPrefix, you are limited to 10 characters for your bucket name identifier in your templates. Buckets are named <Prefix>-<Region>-<AccountId>-<ProjectId>-<StageId>-<ResourceId> or <S3OrgPrefix>-<Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,18}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty or 2 to 20 characters (8 or less recommended). Lower case alphanumeric and dashes. Must start and end with a letter or number."

  RolePath:
    Type: String
    Description: "Path to use for IAM Roles and Policies. You may wish to separate out your applications from users, or create seperate paths per prefix or application. Specific paths may required by permission boundaries. Ex: /ws-hello-world-test/ or /app_role/"
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"
    ConstraintDescription: "May only contain alphanumeric characters, forward slashes, underscores, and dashes. Must begin and end with a slash."

  ParameterStoreHierarchy:
    Type: String
    Description: "Parameters specific to the application may be organized within a hierarchy based on your organizational or operations structure. For example, /Finance/ops/ for this value would then generate /Finance/ops/<DeployEnvironment>/<Prefix>-<ProjectId>-<StageId>/<parameterName>. Must either be a single '/' or begin and end with a '/'."
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9_.\\-]*[\\/])+$|^\\/$"
    ConstraintDescription: "Must only contain alpha-numeric, dashes, underscores, or slashes. Must be a single slash or begin and end with a slash. (/Finance/, /Finance/ops/, or /)"

  PermissionsBoundaryArn:
    Type: String
    Description: "Permissions Boundary is a policy attached to a role to further restrict the permissions of the role. Your organization may or may not require boundaries. If left empty, no permissions boundary will be used."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[\\w+=,.@\\-\\/]*[\\w+=,.@\\-]+$"
    ConstraintDescription: "Must be empty or a valid IAM Policy ARN in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  # ---------------------------------------------------------------------------
  # Deployment Environment Identification

  DeployEnvironment:
    Type: String
    Description: "What deploy/testing environment will this run under? An environment can contain multiple stages (for example 'test' and 't98' would be in 'TEST' environment, and 'beta' and 'prod' stages would deploy to 'PROD'). Utilize this environment variable to determine your tests, app logging levels, and conditionals in the template. For example, PROD will use gradual deployment while DEV and TEST is AllAtOnce. Other resources, such as dashboards and alarms  (which cost money) could be created in PROD and not DEV or TEST. Suggested use: DEV for local SAM deployment, TEST for test/QA deployments, PROD for stage, beta, and main/prod deployments."
    Default: "PROD"
    AllowedValues: ["DEV", "TEST", "PROD"]
    ConstraintDescription: "Must specify DEV, TEST, or PROD."

  DeployRole:
    Type: String
    Description: "IAM role to allow AWS CodeDeploy to manage deployment of AWS Lambda functions"
    AllowedPattern: "^arn:aws:iam::\\d{12}:role/[\\w+=,.@\\-\\/]*[\\w+=,.@\\-\\/]{1}$"
    ConstraintDescription: "A valid IAM role ARN"

  FunctionGradualDeploymentType:
    Type: String
    Description: "For production environments, what method do you want to use to gradually deploy before rolling back in case of errors. Note that when 'DeployEnvironment' is TEST or DEV, gradual deploy will not be enabled and will be same as All At Once"
    Default: "Linear10PercentEvery3Minutes"
    AllowedValues:
      - "Canary10Percent5Minutes" # Canary = First 10%, then after x minutes, full 90% (full deploy after x minutes)
      - "Canary10Percent10Minutes"
      - "Canary10Percent15Minutes"
      - "Canary10Percent30Minutes"
      - "Linear10PercentEvery1Minute" # Linear = Total of 10 deploys every x minutes: 10%, wait x minutes, another 10%, wait, 10%.... (full deploy after 10 * x minutes)
      - "Linear10PercentEvery2Minutes"
      - "Linear10PercentEvery3Minutes"
      - "Linear10PercentEvery10Minutes"
      - "AllAtOnce" # All at once. Recommended only for TEST and DEV environments.

  AlarmNotificationEmail:
    Type: String
    Description: "Email address to send notifications to when alarms are triggered. Be sure to check the inbox as you will need to confirm the subscription."
    AllowedPattern: "^[\\w\\-\\.]+@([\\w\\-]+\\.)+[\\w\\-]{2,4}$"
    ConstraintDescription: "A valid email address"

  # ---------------------------------------------------------------------------
  # Lambda Function Settings

  FunctionTimeOutInSeconds:
    Type: Number
    Description: "Time out in seconds for the Lambda function. API Gateway times out after 30 seconds. This web service is ideal for requests that can complete in less than 10 seconds"
    Default: 10
    MinValue: 3
    MaxValue: 30

  FunctionMaxMemoryInMB:
    Type: Number
    Description: "If you are handling large responses, you will need to increase the size. Monitor CloudWatch logs. 1024 MB is a good starting point for most API web service applications."
    Default: 1024 # 1 GB
    MinValue: 512 # 512 MB
    MaxValue: 10240 # 10 GB
    ConstraintDescription: "Must be between 512 and 1024 MB (10 GB). 1024 MB is a good starting point for most API web service applications."

  FunctionArchitecture:
    Type: String
    Description: "The instruction set architecture for the Lambda function. Lambda functions support x86_64 and arm64 architectures. arm64 has better processing than default x86_64 - but the layers and binaries you use must support it."
    Default: "arm64"
    AllowedValues: ["x86_64", "arm64"]

  # ---------------------------------------------------------------------------
  # Application Parameters

  ApiPathBase:
    Type: String
    Description: "The path API Gateway uses as the first segment in the invoked Uniform Resource Identifier (URI). Since API Gateway generates random characters for the domain, it can be helpful to use this in identifying applications and stages. If a custom domain is used it can be masked and hidden from visitors. For example: xyz08ryz.apigateway.aws.com/pets or xyz08ryz.apigateway.aws.com/myapp or xyz08ryz.apigateway.aws.com/myapp-test. It is recommended you set this in the template-config.json file and allow the stage to be dynamically appended."
    Default: "api"
    AllowedPattern: ^[a-z0-9]([a-z0-9-_]*[a-z0-9])?$
    MaxLength: 128
    MinLength: 1
    ConstraintDescription: "1-128 lowercase alpha numeric, hyphens, and underscores. Must begin and end with an alphanumeric character."

  UserAgent:
    Type: String
    Description: "User Agent string to use when accessing remote services"
    Default: "Web Service"

  LogRetentionInDaysForPROD:
    Type: Number
    Description: "How long should CloudWatch logs be kept in a PRODUCTION environment?"
    Default: 180
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  LogRetentionInDaysForDEVTEST:
    Type: Number
    Description: "How long should CloudWatch logs be kept in a DEV or TEST environment?"
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  ApiGatewayLoggingEnabled:
    Type: String
    Description: "An administrator must enable API Gateway logging account-wide prior to setting this to TRUE. See https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html"
    Default: "FALSE"
    AllowedValues: ["TRUE", "FALSE"]

  # ---------------------------------------------------------------------------
  # Cache-Data Parameters
  # Most of these parameters are passed to Lambda Environment Variables
  # From: https://www.npmjs.com/package/@63klabs/cache-data

  CacheDataDynamoDbTableName:
    Type: String
    Description: "The DynamoDb table name to use for caching data. This is used by the 63klabs/cache-data package. If left blank, it will use the imported value from the Cache Data storage stack output."
    Default: ""
    AllowedPattern: "^[a-zA-Z0-9_.-]{3,255}$|^$"
    ConstraintDescription: "Blank to use ImportedValue, otherwise: Must be between 3 and 255 characters. Can contain alphanumeric characters, underscores, dashes, and periods."
  
  CacheDataS3BucketName:
    Type: String
    Description: "The S3 bucket name to use for caching data. This is used by the 63klabs/cache-data package. If left blank, it will use the imported value from the Cache Data storage stack output."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$|^$"
    ConstraintDescription: "Blank to use ImportedValue, otherwise: Must be between 3 and 63 characters. Lower case alphanumeric and dashes. Must start and end with a letter or number."

  CacheDataTimeZoneForInterval:
    Type: String
    Description: "Cache-Data may expire using an interval such as every four, six, twelve, ... hours on the hour starting at midnight. What timezone holds the midnight to calculate from?"
    Default: "Etc/UTC"
    AllowedValues: ["Etc/UTC", "America/Puerto_Rico", "America/New_York", "America/Indianapolis", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu"] # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
    ConstraintDescription: "Common examples for United States of America. Accepted values can be changed in the template for your region."

  # ---------------------------------------------------------------------------
  # MCP Server Configuration Parameters

  AtlantisS3Buckets:
    Type: CommaDelimitedList
    Description: "Comma-delimited list of S3 bucket names containing Atlantis templates and starters. Buckets must have 'atlantis-mcp:Allow=true' tag and 'atlantis-mcp:IndexPriority' tag with namespace list. Example: bucket1,bucket2,bucket3"
    Default: ""
    ConstraintDescription: "Comma-delimited list of valid S3 bucket names"

  AtlantisGitHubUserOrgs:
    Type: CommaDelimitedList
    Description: "Comma-delimited list of GitHub users/organizations to search for repositories. Example: 63Klabs,myorg,myuser"
    Default: "63Klabs"
    ConstraintDescription: "Comma-delimited list of GitHub usernames or organization names"

  ReadLambdaExecRoleIncludeManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "Comma-delimited list of managed policy ARNs to attach to the Read Lambda execution role for extended permissions. Leave empty if no additional policies needed."
    Default: ""
    ConstraintDescription: "Comma-delimited list of valid IAM policy ARNs"

  # ---------------------------------------------------------------------------
  # Documentation Indexer Schedule Parameters

  DocIndexScheduleForDEVTEST:
    Type: String
    Description: "Cron schedule for the Documentation Indexer in DEV/TEST environments (weekly by default)"
    Default: "cron(0 8 ? * MON *)"
    ConstraintDescription: "A valid EventBridge cron expression"

  DocIndexScheduleForPROD:
    Type: String
    Description: "Cron schedule for the Documentation Indexer in PROD environments (daily by default)"
    Default: "cron(0 6 * * ? *)"
    ConstraintDescription: "A valid EventBridge cron expression"

  # ---------------------------------------------------------------------------
  # Cache TTL Parameters (in seconds)

  CacheTTLFullTemplateContent:
    Type: Number
    Description: "TTL in seconds for full template content cache"
    Default: 3600
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLTemplateVersionHistory:
    Type: Number
    Description: "TTL in seconds for template version history cache"
    Default: 3600
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLTemplateUpdates:
    Type: Number
    Description: "TTL in seconds for template updates cache"
    Default: 3600
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLTemplateList:
    Type: Number
    Description: "TTL in seconds for template list cache"
    Default: 1800
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLAppStarterList:
    Type: Number
    Description: "TTL in seconds for app starter list cache"
    Default: 1800
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLGitHubRepoList:
    Type: Number
    Description: "TTL in seconds for GitHub repository list cache"
    Default: 1800
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLS3BucketList:
    Type: Number
    Description: "TTL in seconds for S3 bucket list cache"
    Default: 1800
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLNamespaceList:
    Type: Number
    Description: "TTL in seconds for namespace list cache"
    Default: 1800
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLCategoryList:
    Type: Number
    Description: "TTL in seconds for category list cache"
    Default: 1800
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  CacheTTLDocumentationIndex:
    Type: Number
    Description: "TTL in seconds for documentation index cache"
    Default: 3600
    MinValue: 60
    MaxValue: 86400
    ConstraintDescription: "Must be between 60 and 86400 seconds (1 minute to 24 hours)"

  # ---------------------------------------------------------------------------
  # Documentation AI (Semantic Search) Parameters
  # Passed to BOTH the Read and Doc Indexer Lambdas as DOC_AI_* environment
  # variables (see spec 0-0-6). The feature defaults OFF (EnableDocAi = "false")
  # so deploying this template changes nothing until an operator explicitly
  # enables it. This task adds Parameters, one Condition, and env-var wiring
  # only; no AI resources (vector bucket, Bedrock permissions) are created yet.

  EnableDocAi:
    Type: String
    Description: "Master toggle for Bedrock-assisted documentation semantic search (DOC_AI_ENABLED). When 'false' (default), search_documentation behaves exactly as the current keyword-only implementation and no AI code path runs."
    Default: "false"
    AllowedValues: ["true", "false"]

  DocAiMinTier:
    Type: String
    Description: "Minimum access tier eligible for semantic search (DOC_AI_MIN_TIER). Requests below this tier use keyword search. Tier order: public < registered < paid < private."
    Default: "paid"
    AllowedValues: ["public", "registered", "paid", "private"]

  DocAiRetrievalMode:
    Type: String
    Description: "Retrieval strategy for eligible requests (DOC_AI_RETRIEVAL_MODE). 'keyword' preserves current behavior; 'semantic' uses vector similarity; 'semantic-assisted' adds a light LLM re-rank/expansion."
    Default: "keyword"
    AllowedValues: ["keyword", "semantic", "semantic-assisted"]

  DocAiEmbeddingModel:
    Type: String
    Description: "Bedrock embedding model ID used to embed queries and content (DOC_AI_EMBEDDING_MODEL). Public model identifier, not a secret."
    Default: "amazon.titan-embed-text-v2:0"
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
    ConstraintDescription: "Must be a Bedrock model identifier (letters, numbers, and . _ : - characters)."

  DocAiEmbeddingDimensions:
    Type: Number
    Description: "Embedding vector dimensions (DOC_AI_EMBEDDING_DIMENSIONS). Titan Text Embeddings V2 supports 256, 512, or 1024."
    Default: 1024
    MinValue: 1
    MaxValue: 4096
    ConstraintDescription: "Must be between 1 and 4096."

  DocAiEmbeddingMaxInputTokens:
    Type: Number
    Description: "Approximate token budget for embedding input; larger entries are truncated before embedding (DOC_AI_EMBEDDING_MAX_INPUT_TOKENS)."
    Default: 8000
    MinValue: 1
    MaxValue: 8192
    ConstraintDescription: "Must be between 1 and 8192 (Titan Text Embeddings V2 max input)."

  DocAiAssistModel:
    Type: String
    Description: "Bedrock invoke ID used only in 'semantic-assisted' mode for query expansion / re-ranking (DOC_AI_ASSIST_MODEL and the source-region inference-profile ARN). Defaults to the Geo (US) cross-region inference profile for Amazon Nova Micro so the stack works out of the box in us-east-1, us-east-2, and us-west-2; may also be set to a plain on-demand foundation-model ID. The underlying plain foundation-model ID used for the destination-region IAM grant lives in DocAiAssistFoundationModel. Public model identifier, not a secret."
    Default: "us.amazon.nova-micro-v1:0"
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
    ConstraintDescription: "Must be a Bedrock model identifier (letters, numbers, and . _ : - characters)."

  DocAiAssistFoundationModel:
    Type: String
    Description: "Plain Bedrock foundation-model ID that the DocAiAssistModel inference profile routes to. Used only to build the destination-region IAM grant when DocAiAssistProfileRegions is non-empty; ignored (and the assist model is invoked directly) when DocAiAssistProfileRegions is empty. Public model identifier, not a secret."
    Default: "amazon.nova-micro-v1:0"
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
    ConstraintDescription: "Must be a Bedrock model identifier (letters, numbers, and . _ : - characters)."

  DocAiAssistMaxCandidates:
    Type: Number
    Description: "Maximum number of top candidates passed to the assist model for re-ranking (DOC_AI_ASSIST_MAX_CANDIDATES)."
    Default: 25
    MinValue: 1
    MaxValue: 200
    ConstraintDescription: "Must be between 1 and 200."

  DocAiTopK:
    Type: Number
    Description: "Number of results returned from semantic retrieval (DOC_AI_TOP_K)."
    Default: 10
    MinValue: 1
    MaxValue: 100
    ConstraintDescription: "Must be between 1 and 100."

  DocAiCandidateMultiplier:
    Type: Number
    Description: "Multiplier applied to Top K to determine how many candidate vectors to fetch before ranking/filtering (DOC_AI_CANDIDATE_MULTIPLIER)."
    Default: 3
    MinValue: 1
    MaxValue: 20
    ConstraintDescription: "Must be between 1 and 20."

  DocAiS3VectorBucket:
    Type: String
    Description: "Name of the S3 Vectors bucket used for semantic retrieval (DOC_AI_S3_VECTOR_BUCKET). Leave empty to use the stack-derived default name; semantic search falls back to keyword when the vector bucket is unavailable."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty, or 3 to 63 characters: lower case alphanumeric and dashes, starting and ending with a letter or number."

  DocAiS3VectorIndex:
    Type: String
    Description: "Name of the S3 Vectors index within the vector bucket (DOC_AI_S3_VECTOR_INDEX). Leave empty until the vector index is provisioned; semantic search falls back to keyword when unset."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty, or 3 to 63 characters: lower case alphanumeric, dashes, and periods, starting and ending with a letter or number."

  DocAiEmbeddingRegion:
    Type: String
    Description: "Optional AWS region to source the Bedrock EMBEDDING model from (DOC_AI_EMBEDDING_REGION), overriding the Lambda deployment region. Leave empty (default) to use the deployment region. Set this when the embedding model (e.g. Titan v2) is unavailable in your deployment region; a common fallback is us-east-1. Embedding models cannot use cross-region inference profiles, so this hard client-side pin is the only cross-region option for embeddings."
    Default: ""
    AllowedPattern: "^[a-z]{2}(-[a-z]+)+-\\d+$|^$"
    ConstraintDescription: "May be empty, or a valid AWS region code such as us-east-1 or us-gov-west-1."

  DocAiAssistProfileRegions:
    Type: CommaDelimitedList
    Description: "Comma-delimited list of AWS regions the DocAiAssistModel cross-region inference profile may route to (used only for IAM Resource scoping; not passed to the Lambda runtime). Defaults to the Geo (US) destination regions for the default Nova Micro inference profile. When non-empty, DocAiAssistModel must be an inference-profile id: the assist IAM policy grants the inference-profile ARN plus the plain foundation model named by DocAiAssistFoundationModel, restricted to exactly these regions via the aws:RequestedRegion condition key (AWS's documented cross-region inference pattern - still model-pinned and least-privilege). Set to empty to fall back to a single in-region plain foundation-model ARN (requires DocAiAssistModel to be a plain foundation-model id, e.g. for strict in-region us-east-1 on-demand invocation)."
    Default: "us-east-1,us-east-2,us-west-2"

# =============================================================================
# MAPPINGS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/mappings-section-structure.html
#

Mappings:

  # Add/Change to your regions as needed
  # These accounts and layers are AWS Managed so you can trust them - They are not some random accounts
  # Source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights-extension-versionsx86-64.html
  LambdaInsightsX86:
    us-east-1:
      ExtArn: "arn:aws:lambda:us-east-1:580247275435:layer:LambdaInsightsExtension:66"
    us-east-2:
      ExtArn: "arn:aws:lambda:us-east-2:580247275435:layer:LambdaInsightsExtension:71"
    us-west-1:
      ExtArn: "arn:aws:lambda:us-west-1:580247275435:layer:LambdaInsightsExtension:66"
    us-west-2:
      ExtArn: "arn:aws:lambda:us-west-2:580247275435:layer:LambdaInsightsExtension:66"

  # Add/Change to your regions as needed
  # These accounts and layers are AWS Managed so you can trust them - They are not some random accounts
  # Source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights-extension-versionsARM.html
  LambdaInsightsArm:
    us-east-1:
      ExtArn: "arn:aws:lambda:us-east-1:580247275435:layer:LambdaInsightsExtension-Arm64:31"
    us-east-2:
      ExtArn: "arn:aws:lambda:us-east-2:580247275435:layer:LambdaInsightsExtension-Arm64:33"
    us-west-1:
      ExtArn: "arn:aws:lambda:us-west-1:580247275435:layer:LambdaInsightsExtension-Arm64:29"
    us-west-2:
      ExtArn: "arn:aws:lambda:us-west-2:580247275435:layer:LambdaInsightsExtension-Arm64:31"

# =============================================================================
# CONDITIONS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference-conditions.html
#

Conditions:
  IsProduction: !Equals [!Ref DeployEnvironment, "PROD"]
  # IsNotProduction: !Not [!Equals [!Ref DeployEnvironment, "PROD"]]
  # IsTest: !Equals [!Ref DeployEnvironment, "TEST"]
  # IsDevelopment: !Equals [!Ref DeployEnvironment, "DEV"]
  IsNotDevelopment: !Not [!Equals [!Ref DeployEnvironment, "DEV"]]
  CreateProdResources: !Equals [!Ref DeployEnvironment, "PROD"]
  # CreateTestResources: !Equals [!Ref DeployEnvironment, "TEST"]
  # CreateDevResources: !Equals [!Ref DeployEnvironment, "DEV"]
  # UseS3BucketNameOrgPrefix: !Not [!Equals [!Ref S3BucketNameOrgPrefix, ""]]
  CreateAlarms: !Equals [!Ref DeployEnvironment, "PROD"] # !Equals ["ALWAYS", "ALWAYS"] # Option if you want to ALWAYS create an alarm or only in PROD. Alarms cost money so you may only want them in Prod (or temporarily in test)
  HasPermissionsBoundaryArn: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  IsArmArch: !Equals [!Ref FunctionArchitecture, "arm64"]
  ApiGatewayLoggingIsEnabled: !Equals [!Ref ApiGatewayLoggingEnabled, "TRUE"]
  HasCacheDataDynamoDbTableName: !Not [!Equals [!Ref CacheDataDynamoDbTableName, ""]]
  HasCacheDataS3BucketName: !Not [!Equals [!Ref CacheDataS3BucketName, ""]]
  HasCacheDataStorageStack: !Not [!And [!Condition HasCacheDataDynamoDbTableName, !Condition HasCacheDataS3BucketName]]
  HasReadLambdaManagedPolicies: !Not [!Equals [!Join ['', !Ref ReadLambdaExecRoleIncludeManagedPolicyArns], '']]
  # Documentation AI (Semantic Search) master toggle. Gates ALL AI resources: the S3
  # Vectors provisioner Lambda + role + log group and the vector index custom resource
  # (task 4.3). Bedrock/S3 Vectors DATA-plane IAM for the read-function/doc-indexer is
  # added in task 8.1. When "false" (default) no AI resources are created (Req 8.1).
  EnableDocAiIsTrue: !Equals [!Ref EnableDocAi, "true"]

  # S3 Vectors bucket/index name resolution. When an operator supplies an explicit name,
  # use it; otherwise derive a canonical name from Prefix/ProjectId/StageId. These two
  # Conditions back the identical !If/!Sub expressions used in three places (kept in sync):
  # the vector index custom resource, the provisioner IAM policy ARNs, and the
  # read-function/doc-indexer DOC_AI_S3_VECTOR_* env vars.
  HasDocAiS3VectorBucketOverride: !Not [!Equals [!Ref DocAiS3VectorBucket, ""]]
  HasDocAiS3VectorIndexOverride: !Not [!Equals [!Ref DocAiS3VectorIndex, ""]]

  # Cross-region Bedrock access (spec 0-0-6, Req 10). When an operator supplies an explicit
  # embedding region, pin the embedding client to it; otherwise the Lambda uses its own
  # deployment region (AWS_REGION) and the DOC_AI_EMBEDDING_REGION env var resolves to "".
  # Mirrors the HasDocAiS3VectorBucketOverride pattern.
  HasDocAiEmbeddingRegionOverride: !Not [!Equals [!Ref DocAiEmbeddingRegion, ""]]
  # DocAiAssistProfileRegions is a CommaDelimitedList; joining its elements yields "" only
  # when the list is empty (the default single empty-string element), so this detects a
  # populated list without a per-element check. IAM-only; never reaches the Lambda runtime.
  HasDocAiAssistProfileRegions: !Not [!Equals [!Join ["", !Ref DocAiAssistProfileRegions], ""]]

# =============================================================================
# GLOBALS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy-globals.html
#

Globals:
  Api:
    OpenApiVersion: 3.0.0 #>! Prevents extra stage called Stage in API Gateway https://www.internetkatta.com/how-to-prevent-aws-sam-from-creating-the-default-stage-in-api-gateway-stage
    PropagateTags: True
    TracingEnabled: True # X-Ray

  Function:
    PropagateTags: True
    Tracing: "Active" # X-Ray

  # StateMachine:
  #   PropagateTags: True

# =============================================================================
# RESOURCES
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html  
#

Resources:

  # ---------------------------------------------------------------------------
  # API Gateway
  # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-api.html#sam-api-minimumcompressionsize

  # -- API Gateway --
  WebApi:
    Type: AWS::Serverless::Api 
    Properties: 
      Name: !Sub '${Prefix}-${ProjectId}-${StageId}-WebApi'
      StageName: !Ref ApiPathBase

      Cors: # MCP server accepts POST requests from any origin
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        MaxAge: "'86400'"

      DefinitionBody:
        "Fn::Transform":
          Name: "AWS::Include"
          Parameters:
            Location: ./template-openapi-spec.yml

      # -- The following adds two levels of logging to API Gateway --
      # -- However, an account admin will need to add a service role to allow API Gateway to write to CloudWatch logs --
      # -- See https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-logging.html --

      # Add API Gateway logging configuration
      AccessLogSetting: !If
        - ApiGatewayLoggingIsEnabled
        - DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
          Format: '{"requestId":"$context.requestId", "extendedRequestId":"$context.extendedRequestId", "ip":"$context.identity.sourceIp", "caller":"$context.identity.caller", "user":"$context.identity.user", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod", "path":"$context.path", "resourcePath":"$context.resourcePath", "routeKey":"$context.routeKey", "status":"$context.status", "protocol":"$context.protocol", "responseLength":"$context.responseLength", "integrationError":"$context.integrationErrorMessage", "authorizerError":"$context.authorizer.error", "authorizerStatus":"$context.authorizer.status", "authorizerLatency":"$context.authorizer.latency"}'
        - !Ref 'AWS::NoValue'
      
      # Add execution logging to CloudWatch
      MethodSettings: !If
        - ApiGatewayLoggingIsEnabled
        - - LoggingLevel: !If [IsProduction, 'ERROR', 'INFO']
            ResourcePath: '/*'
            HttpMethod: '*'
            DataTraceEnabled: !If [IsProduction, False, True]
            MetricsEnabled: True
        - !Ref 'AWS::NoValue'
  
  # Add CloudWatch Log Group for API Gateway Access Logs
  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ApiGatewayLoggingIsEnabled
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${Prefix}-${ProjectId}-${StageId}-WebApi-access-logs'
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD,  !Ref LogRetentionInDaysForDEVTEST]

  # Add CloudWatch Log Group for API Gateway Execution Logs
  ApiGatewayExecutionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ApiGatewayLoggingIsEnabled
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub 'API-Gateway-Execution-Logs_${WebApi}/${ApiPathBase}' # AWS default
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD,  !Ref LogRetentionInDaysForDEVTEST]

  # ---------------------------------------------------------------------------
  # Lambda Layers
  # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-layerversion.html
  #

  # -- doc-ai-common Layer --
  # Shared code (EmbeddingProvider, VectorStore, RetrievalStrategy) for the
  # Bedrock-assisted documentation semantic search feature (spec 0-0-6).
  # Attached to BOTH the read-function (query path) and doc-indexer (index path)
  # so the shared abstractions live once instead of being duplicated per
  # function (Req 8.5). The layer is only code -- it has no standing cost and no
  # Bedrock/S3 permissions -- so it is attached UNCONDITIONALLY; the EnableDocAi
  # Condition gates only the billable AI resources and IAM added in later tasks
  # (4.3 / 8.1). At runtime the ContentUri contents under nodejs/ are extracted
  # to /opt/nodejs/. First-party modules are added by tasks 2.2 (EmbeddingProvider),
  # 3.x (VectorStore) and 6.x (RetrievalStrategy). The layer bundles no production
  # npm dependencies; the AWS SDK v3 is provided by the Lambda runtime.
  DocAiCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${Prefix}-${ProjectId}-${StageId}-DocAiCommon'
      Description: "Shared code for Bedrock-assisted documentation semantic search (read-function + doc-indexer)."
      ContentUri: src/lambda/layers/doc-ai-common/
      CompatibleRuntimes:
        - nodejs24.x
      # Pure-JavaScript layer (no native binaries), so it is compatible with both
      # architectures; listing both avoids coupling to FunctionArchitecture.
      CompatibleArchitectures:
        - arm64
        - x86_64
      # Delete superseded versions on stack update so orphaned layer versions do
      # not accumulate; both functions always !Ref the latest published version.
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------------
  # Lambda Functions
  # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
  #

  # -- Read Lambda Function --
  # Handles all read-only MCP operations with minimal AWS permissions

  ReadLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-ReadFunction'
      Description: "MCP Server Read-Only Operations - Template discovery, starter code, documentation search"

      VersionDescription: "MCP Server Read Lambda Version"
      AutoPublishCodeSha256: "20260224T000000"
      AutoPublishAlias: live

      DeploymentPreference:
        Enabled: !If [ IsProduction, True,  False]
        Type: !If [ IsProduction, !Ref FunctionGradualDeploymentType, "AllAtOnce"]
        Role: !Ref DeployRole
        Alarms:
          Fn::If:
            - CreateAlarms
            - - !Ref ReadLambdaErrorsAlarm
            - - !Ref 'AWS::NoValue'

      CodeUri: src/lambda/read-function/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - !Ref FunctionArchitecture
      Timeout: !Ref FunctionTimeOutInSeconds
      MemorySize: !Ref FunctionMaxMemoryInMB
      Role: !GetAtt ReadLambdaExecutionRole.Arn

      Layers:

        # Lambda Insights Layer - ARN is Mapped in as they vary by region and architecture - Update regions and versions in Mapping section
        - !If
          - IsArmArch
          - !FindInMap [LambdaInsightsArm, !Ref 'AWS::Region', ExtArn]
          - !FindInMap [LambdaInsightsX86, !Ref 'AWS::Region', ExtArn]
        
        # Lambda SSM Parameters and Secrets Extension Layer - Using Public SSM Parameter from AWS - Use mapping if not available in your region
        - '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/arm64/latest}}' #arm64 - There is also an x86 version available too

        # doc-ai-common shared-code layer (spec 0-0-6); code only, attached unconditionally
        - !Ref DocAiCommonLayer

      Environment:
        Variables:
          userAgentIdentifier: !Ref UserAgent
          lambdaTimeoutInSeconds: !Ref FunctionTimeOutInSeconds

          NODE_ENV: "production"
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment
          LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"] # 0-2 (ERROR, WARN, INFO) for prod, 3-5 (MSG, DIAG, DEBUG) for non-prod
          PARAM_STORE_PATH: !Ref ParameterStoreHierarchy

          PARAMETERS_SECRETS_EXTENSION_LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"] # 'DEBUG', 'WARN', 'ERROR', 'NONE', 'INFO'
          AWS_LAMBDA_LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"] # 'DEBUG', 'WARN', 'ERROR', 'INFO' - 'CRITICAL' and 'SILENT' are not currently recognized by Cache Data logging
          AWS_LAMBDA_LOG_FORMAT: 'text'

          # MCP Server Configuration
          ATLANTIS_S3_BUCKETS: !Join [',', !Ref AtlantisS3Buckets]
          ATLANTIS_GITHUB_USER_ORGS: !Join [',', !Ref AtlantisGitHubUserOrgs]

          # Cache TTL Settings (in seconds)
          CACHE_TTL_FULL_TEMPLATE_CONTENT: !Ref CacheTTLFullTemplateContent
          CACHE_TTL_TEMPLATE_VERSION_HISTORY: !Ref CacheTTLTemplateVersionHistory
          CACHE_TTL_TEMPLATE_UPDATES: !Ref CacheTTLTemplateUpdates
          CACHE_TTL_TEMPLATE_LIST: !Ref CacheTTLTemplateList
          CACHE_TTL_APP_STARTER_LIST: !Ref CacheTTLAppStarterList
          CACHE_TTL_GITHUB_REPO_LIST: !Ref CacheTTLGitHubRepoList
          CACHE_TTL_S3_BUCKET_LIST: !Ref CacheTTLS3BucketList
          CACHE_TTL_NAMESPACE_LIST: !Ref CacheTTLNamespaceList
          CACHE_TTL_CATEGORY_LIST: !Ref CacheTTLCategoryList
          CACHE_TTL_DOCUMENTATION_INDEX: !Ref CacheTTLDocumentationIndex

          # Cache-Data Settings
          CACHE_DATA_TIME_ZONE_FOR_INTERVAL: !Ref CacheDataTimeZoneForInterval
          # Read by BOTH @63klabs/cache-data's AWS helper and this project's xray-capture
          # helper (spec 0-0-6); removing it silently disables downstream subsegments for
          # DynamoDB/S3/Bedrock/S3 Vectors even though Tracing stays Active below.
          CACHE_DATA_AWS_X_RAY_ON: true
          # >! Defensive: if tracing is ever off while the flag above is true, treat a
          # >! missing X-Ray context as a no-op instead of an error (Requirement 7.2).
          AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR
          CACHE_DATA_USE_TOOLS_HASH_METHOD: true
          CACHE_USE_IN_MEMORY: true
          CACHE_DATA_DYNAMO_DB_TABLE: !If 
            - HasCacheDataDynamoDbTableName
            - !Ref CacheDataDynamoDbTableName
            - Fn::ImportValue:
                'Fn::Sub': '${Prefix}-CacheDataDynamoDbTable'
          CACHE_DATA_S3_BUCKET: !If 
            - HasCacheDataS3BucketName
            - !Ref CacheDataS3BucketName
            - Fn::ImportValue:
                'Fn::Sub': '${Prefix}-CacheDataS3Bucket'

          # Authentication - Users Table and Cognito
          MCP_DYNAMODB_USERS_TABLE: !Ref UsersTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool

          # Rate Limiter Sessions Table
          MCP_DYNAMODB_SESSIONS_TABLE: !Ref DynamoDbSessions

          # Documentation Index Table
          DOC_INDEX_TABLE: !Ref DocIndexTable

          # Documentation AI (Semantic Search) Settings
          # Feature defaults OFF (DOC_AI_ENABLED = "false"); parsed defensively by
          # read-function/config/settings.js. Numbers render as strings via !Ref,
          # which the JS parsers handle.
          DOC_AI_ENABLED: !Ref EnableDocAi
          DOC_AI_MIN_TIER: !Ref DocAiMinTier
          DOC_AI_RETRIEVAL_MODE: !Ref DocAiRetrievalMode
          DOC_AI_EMBEDDING_MODEL: !Ref DocAiEmbeddingModel
          DOC_AI_EMBEDDING_DIMENSIONS: !Ref DocAiEmbeddingDimensions
          DOC_AI_EMBEDDING_MAX_INPUT_TOKENS: !Ref DocAiEmbeddingMaxInputTokens
          # Optional embedding client region override (DOC_AI_EMBEDDING_REGION). Gated via
          # HasDocAiEmbeddingRegionOverride so it resolves to an empty string when unset,
          # keeping this env var byte-identical to before the cross-region feature. Empty
          # means "use the Lambda deployment region" (parsed defensively; never throws).
          DOC_AI_EMBEDDING_REGION: !If [HasDocAiEmbeddingRegionOverride, !Ref DocAiEmbeddingRegion, ""]
          DOC_AI_ASSIST_MODEL: !Ref DocAiAssistModel
          DOC_AI_ASSIST_MAX_CANDIDATES: !Ref DocAiAssistMaxCandidates
          DOC_AI_TOP_K: !Ref DocAiTopK
          DOC_AI_CANDIDATE_MULTIPLIER: !Ref DocAiCandidateMultiplier
          # Resolved S3 Vectors bucket/index names. These use the SAME !If/!Sub
          # expressions as the vector index custom resource and the provisioner IAM policy
          # so the read path targets exactly the created bucket/index (task 4.3). When
          # EnableDocAi is false the bucket/index are not created and these values are inert
          # (the code path is gated off by DOC_AI_ENABLED = "false").
          DOC_AI_S3_VECTOR_BUCKET: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']
          DOC_AI_S3_VECTOR_INDEX: !If [HasDocAiS3VectorIndexOverride, !Ref DocAiS3VectorIndex, !Sub '${Prefix}-${ProjectId}-${StageId}-docidx']

      Events:
        McpV1Post:
          Type: Api
          Properties:
            Path: /mcp/v1
            Method: post
            RestApiId: !Ref WebApi

  # -- DynamoDB Sessions Table for Rate Limiting --
  # Stores per-client rate limit counters with atomic updates and TTL cleanup

  DynamoDbSessions:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${Prefix}-${ProjectId}-${StageId}-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref StageId
        - Key: Project
          Value: !Ref ProjectId
        - Key: ManagedBy
          Value: CloudFormation

  # -- DocIndex DynamoDB Table --
  # Stores indexed documentation content, main index, search keywords, and version pointers

  DocIndexTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${Prefix}-${ProjectId}-${StageId}-DocIndex'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref StageId
        - Key: Project
          Value: !Ref ProjectId
        - Key: ManagedBy
          Value: CloudFormation

  # -- DynamoDB Users Table for Authentication --
  # Stores user records (KEY#<hash>) and voucher records (VOUCHER#<code>)
  # Used by Read Lambda for API key lookups and Auth Lambda for user management

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${Prefix}-${ProjectId}-${StageId}-Users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: OLD_IMAGE
      Tags:
        - Key: Environment
          Value: !Ref StageId
        - Key: Project
          Value: !Ref ProjectId
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # Cognito User Pool and Client
  # Manages user registration, email verification, and authentication
  # Custom attributes store API key hash and tier for each user

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Prefix}-${ProjectId}-${StageId}-UserPool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: tier
          AttributeDataType: String
          Mutable: true
        - Name: api_key
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${Prefix}-${ProjectId}-${StageId}-WebClient'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # -- SSM Parameter for Cognito User Pool ID --
  # Stored in SSM so Auth Lambda can retrieve it at runtime for API endpoints
  # (Post-Confirmation trigger receives the pool ID in the event payload)
  CognitoUserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "${ParameterStoreHierarchy}app-stack/Mcp_CognitoUserPoolId" # app-stack/ sub-path is CRUD for application templates
      Type: String
      Value: !Ref CognitoUserPool
      Description: "Cognito User Pool ID for Auth Lambda API endpoints"

  # ---------------------------------------------------------------------------
  # Auth Lambda Function
  # Handles API key regeneration, voucher redemption, and Cognito Post-Confirmation trigger

  AuthLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-AuthFunction'
      Description: "Auth operations - Key regeneration, voucher redemption, Cognito Post-Confirmation"
      CodeUri: src/lambda/auth-function/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - !Ref FunctionArchitecture
      Timeout: 10
      MemorySize: 512
      Role: !GetAtt AuthLambdaExecutionRole.Arn

      Layers:
      
        # Lambda Insights Layer - ARN is Mapped in as they vary by region and architecture - Update regions and versions in Mapping section
        - !If
          - IsArmArch
          - !FindInMap [LambdaInsightsArm, !Ref 'AWS::Region', ExtArn]
          - !FindInMap [LambdaInsightsX86, !Ref 'AWS::Region', ExtArn]

        # Lambda SSM Parameters and Secrets Extension Layer - Using Public SSM Parameter from AWS - Use mapping if not available in your region
        - '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/arm64/latest}}' #arm64 - There is also an x86 version available too

      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          SESSIONS_TABLE: !Ref DynamoDbSessions
          PARAM_STORE_PATH: !Ref ParameterStoreHierarchy
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment

          NODE_ENV: "production"
          LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"] # 0-2 (ERROR, WARN, INFO) for prod, 3-5 (MSG, DIAG, DEBUG) for non-prod

          PARAMETERS_SECRETS_EXTENSION_LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"] # 'DEBUG', 'WARN', 'ERROR', 'NONE', 'INFO'
          AWS_LAMBDA_LOG_LEVEL: !If [ IsProduction, "INFO", "DEBUG"] # 'DEBUG', 'WARN', 'ERROR', 'INFO' - 'CRITICAL' and 'SILENT' are not currently recognized by Cache Data logging
          AWS_LAMBDA_LOG_FORMAT: 'text'

          # X-Ray downstream tracing (spec 0-0-6). CACHE_DATA_AWS_X_RAY_ON gates the X-Ray
          # capture wrapping in both @63klabs/cache-data and this project's xray-capture
          # helper. AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR is defensive so a flag-true/
          # tracing-off mismatch does not surface as an error (Requirement 7.2).
          CACHE_DATA_AWS_X_RAY_ON: true
          AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR

          # Rate limit configuration (must match Read Lambda settings)
          MCP_PUBLIC_RATE_LIMIT: 50
          MCP_PUBLIC_RATE_TIME_RANGE_MINUTES: 60
          MCP_REGISTERED_RATE_LIMIT: 100
          MCP_REGISTERED_RATE_TIME_RANGE_MINUTES: 60
          MCP_PAID_RATE_LIMIT: 3000
          MCP_PAID_RATE_TIME_RANGE_MINUTES: 1440
          MCP_PRIVATE_RATE_LIMIT: 6000
          MCP_PRIVATE_RATE_TIME_RANGE_MINUTES: 1440

      Events:
        CognitoPostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref CognitoUserPool
            Trigger: PostConfirmation
        KeyRegenerate:
          Type: Api
          Properties:
            Path: /mcp/auth/key/regenerate
            Method: post
            RestApiId: !Ref WebApi
        VoucherRedeem:
          Type: Api
          Properties:
            Path: /mcp/auth/voucher/redeem
            Method: post
            RestApiId: !Ref WebApi
        GetProfile:
          Type: Api
          Properties:
            Path: /mcp/auth/profile
            Method: get
            RestApiId: !Ref WebApi

  # -- Auth Lambda Log Group --

  AuthLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-AuthFunction'
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD, !Ref LogRetentionInDaysForDEVTEST]

  # -- Auth Lambda Execution Role --
  # Least-privilege: DynamoDB CRUD on Users Table + GSI, SSM GetParameter, Cognito AdminUpdateUserAttributes, CloudWatch Logs

  AuthLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-AuthExecutionRole"
      Description: "IAM Role for Auth Lambda with DynamoDB, SSM, and Cognito permissions"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']

      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      # X-Ray write only. Globals.Function.Tracing: Active applies to every function in
      # this stack, so this role needs write permission to emit its own function segment.
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'

      Policies:
      - PolicyName: AuthLambdaResourceAccessPolicies
        PolicyDocument:
          Statement:

          - Sid: LambdaAccessToWriteLogs
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource: !GetAtt AuthLambdaLogGroup.Arn

          - Sid: LambdaAccessToSSMParameters
            Action:
            - ssm:GetParameter
            Effect: Allow
            Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}*"

          - Sid: UsersTableReadWriteAccess
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            Effect: Allow
            Resource:
            - !GetAtt UsersTable.Arn
            - !Sub "${UsersTable.Arn}/index/*"

          - Sid: SessionsTableReadAccess
            Action:
            - dynamodb:GetItem
            Effect: Allow
            Resource:
            - !GetAtt DynamoDbSessions.Arn

          - Sid: CognitoAdminUpdateUserAttributes
            Action:
            - cognito-idp:AdminUpdateUserAttributes
            Effect: Allow
            Resource:
            - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  # -- Lambda permissions allowing API Gateway to execute Auth Lambda --

  AuthLambdaPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  # -- Cleanup Lambda Function --
  # Triggered by DynamoDB Streams on Users table to remove orphaned Cognito accounts on TTL deletions

  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-CleanupFunction'
      Description: "Cleanup Lambda - Removes orphaned Cognito accounts on DynamoDB TTL deletions"
      CodeUri: src/lambda/cleanup-function/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - !Ref FunctionArchitecture
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt CleanupExecutionRole.Arn

      Layers:
      
        # Lambda Insights Layer - ARN is Mapped in as they vary by region and architecture - Update regions and versions in Mapping section
        - !If
          - IsArmArch
          - !FindInMap [LambdaInsightsArm, !Ref 'AWS::Region', ExtArn]
          - !FindInMap [LambdaInsightsX86, !Ref 'AWS::Region', ExtArn]

      Environment:
        Variables:
          PARAM_STORE_PATH: !Ref ParameterStoreHierarchy
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment

      Events:
        UsersTableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt UsersTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 30
            MaximumRetryAttempts: 3
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # -- Cleanup Lambda Log Group --

  CleanupLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-CleanupFunction'
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD, !Ref LogRetentionInDaysForDEVTEST]

  # -- Cleanup Lambda Execution Role --
  # Least-privilege: DynamoDB Streams read on UsersTable, Cognito AdminDeleteUser, SSM GetParameter, CloudWatch Logs

  CleanupExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-CleanupExecution"
      Description: "IAM Role for Cleanup Lambda with DynamoDB Streams, Cognito, SSM, and CloudWatch Logs permissions"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']

      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      # X-Ray write only. The Cleanup Lambda is out of scope for downstream-subsegment
      # instrumentation (it calls only SSM and Cognito), but Globals.Function.Tracing:
      # Active still applies, so it needs this to emit its own function segment.
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'

      Policies:
      - PolicyName: CleanupLambdaResourceAccessPolicies
        PolicyDocument:
          Statement:

          - Sid: DynamoDbStreamsRead
            Action:
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:DescribeStream
            - dynamodb:ListStreams
            Effect: Allow
            Resource: !GetAtt UsersTable.StreamArn

          - Sid: CognitoAdminDeleteUser
            Action:
            - cognito-idp:AdminDeleteUser
            Effect: Allow
            Resource: !GetAtt CognitoUserPool.Arn

          - Sid: SsmGetCognitoUserPoolId
            Action:
            - ssm:GetParameter
            Effect: Allow
            Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}app-stack/Mcp_CognitoUserPoolId"

          - Sid: LambdaAccessToWriteLogs
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource: !GetAtt CleanupLambdaLogGroup.Arn

  # -- Doc Indexer Lambda Function --
  # Scheduled Lambda that builds the persistent DynamoDB documentation index

  DocIndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-DocIndexer'
      Description: "Documentation Indexer - Builds persistent DynamoDB index from GitHub repositories"
      CodeUri: src/lambda/doc-indexer/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - !Ref FunctionArchitecture
      Timeout: 900
      MemorySize: 1024
      Role: !GetAtt DocIndexerExecutionRole.Arn

      Layers:
      
        # Lambda Insights Layer - ARN is Mapped in as they vary by region and architecture - Update regions and versions in Mapping section
        - !If
          - IsArmArch
          - !FindInMap [LambdaInsightsArm, !Ref 'AWS::Region', ExtArn]
          - !FindInMap [LambdaInsightsX86, !Ref 'AWS::Region', ExtArn]
        
        # Lambda SSM Parameters and Secrets Extension Layer - Using Public SSM Parameter from AWS - Use mapping if not available in your region
        - '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/arm64/latest}}' #arm64 - There is also an x86 version available too

        # doc-ai-common shared-code layer (spec 0-0-6); code only, attached unconditionally
        - !Ref DocAiCommonLayer

      Environment:
        Variables:
          ATLANTIS_GITHUB_USER_ORGS: !Join [',', !Ref AtlantisGitHubUserOrgs]
          DOC_INDEX_TABLE: !Ref DocIndexTable
          PARAM_STORE_PATH: !Ref ParameterStoreHierarchy
          DEPLOY_ENVIRONMENT: !Ref DeployEnvironment

          # X-Ray downstream tracing (spec 0-0-6). CACHE_DATA_AWS_X_RAY_ON gates the X-Ray
          # capture wrapping in both @63klabs/cache-data and this project's xray-capture
          # helper. AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR is defensive so a flag-true/
          # tracing-off mismatch does not surface as an error (Requirement 7.2).
          CACHE_DATA_AWS_X_RAY_ON: true
          AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR

          # Documentation AI (Semantic Search) Settings
          # Feature defaults OFF (DOC_AI_ENABLED = "false"); parsed defensively by
          # doc-indexer/lib/settings.js (loadDocAiSettings). The indexer consumes a
          # subset (enabled, embedding model/dims/token budget, S3 Vectors
          # location); the full set is passed for config parity with the
          # read-function. Numbers render as strings via !Ref, which the JS parsers handle.
          DOC_AI_ENABLED: !Ref EnableDocAi
          DOC_AI_MIN_TIER: !Ref DocAiMinTier
          DOC_AI_RETRIEVAL_MODE: !Ref DocAiRetrievalMode
          DOC_AI_EMBEDDING_MODEL: !Ref DocAiEmbeddingModel
          DOC_AI_EMBEDDING_DIMENSIONS: !Ref DocAiEmbeddingDimensions
          DOC_AI_EMBEDDING_MAX_INPUT_TOKENS: !Ref DocAiEmbeddingMaxInputTokens
          # Optional embedding client region override (DOC_AI_EMBEDDING_REGION). Gated via
          # HasDocAiEmbeddingRegionOverride so it resolves to an empty string when unset,
          # keeping this env var byte-identical to before the cross-region feature. Empty
          # means "use the Lambda deployment region" (parsed defensively; never throws).
          DOC_AI_EMBEDDING_REGION: !If [HasDocAiEmbeddingRegionOverride, !Ref DocAiEmbeddingRegion, ""]
          DOC_AI_ASSIST_MODEL: !Ref DocAiAssistModel
          DOC_AI_ASSIST_MAX_CANDIDATES: !Ref DocAiAssistMaxCandidates
          DOC_AI_TOP_K: !Ref DocAiTopK
          DOC_AI_CANDIDATE_MULTIPLIER: !Ref DocAiCandidateMultiplier
          # Resolved S3 Vectors bucket/index names. Identical !If/!Sub expressions to the
          # read-function and the vector index custom resource so the indexer upserts to
          # exactly the created bucket/index (task 4.3). Inert when EnableDocAi is false.
          DOC_AI_S3_VECTOR_BUCKET: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']
          DOC_AI_S3_VECTOR_INDEX: !If [HasDocAiS3VectorIndexOverride, !Ref DocAiS3VectorIndex, !Sub '${Prefix}-${ProjectId}-${StageId}-docidx']

  # -- Doc Indexer Lambda Log Group --

  DocIndexerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-DocIndexer'
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD, !Ref LogRetentionInDaysForDEVTEST]

  # -- Doc Indexer Execution Role --
  # DynamoDB read/write on DocIndex table, SSM GetParameter for GitHubToken, CloudWatch Logs

  DocIndexerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-DocIndexerRole"
      Description: "IAM Role for Doc Indexer Lambda with DynamoDB write and SSM read permissions"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']

      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'

      Policies:
      - PolicyName: DocIndexerResourceAccessPolicies
        PolicyDocument:
          Statement:

          - Sid: LambdaAccessToWriteLogs
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource: !GetAtt DocIndexerLogGroup.Arn

          - Sid: LambdaAccessToSSMParameters
            Action:
            - ssm:GetParameter
            Effect: Allow
            Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}*"

          - Sid: DocIndexTableReadWriteAccess
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:BatchWriteItem
            - dynamodb:Query
            Effect: Allow
            Resource:
            - !GetAtt DocIndexTable.Arn

  # -- EventBridge Schedule for Doc Indexer --

  DocIndexerScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Prefix}-${ProjectId}-${StageId}-DocIndexerSchedule'
      Description: "Scheduled trigger for Documentation Indexer Lambda"
      ScheduleExpression: !If [IsProduction, !Ref DocIndexScheduleForPROD, !Ref DocIndexScheduleForDEVTEST]
      State: ENABLED
      Targets:
        - Arn: !GetAtt DocIndexerFunction.Arn
          Id: DocIndexerTarget

  DocIndexerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DocIndexerFunction.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DocIndexerScheduleRule.Arn

  # ---------------------------------------------------------------------------
  # Documentation AI (Semantic Search) - S3 Vectors Provisioning
  # spec 0-0-6, task 4.3
  # ---------------------------------------------------------------------------
  # S3 Vectors has no native CloudFormation resource type (task 4.1 spike), so a
  # Lambda-backed custom resource owns the vector bucket + index create/update/delete
  # lifecycle (which also provides the clean teardown AGENTS.md requires of SDK-driven
  # infra). EVERYTHING in this section is gated by the EnableDocAiIsTrue Condition, so a
  # default (disabled) deploy creates NO AI resources (Req 8.1).
  #
  # SCOPE NOTE: this section grants only the provisioner's CONTROL-plane permissions
  # (create/delete vector bucket + index). The runtime DATA-plane permissions
  # (s3vectors:PutVectors/QueryVectors/GetVectors/ListVectors/DeleteVectors) and
  # bedrock:InvokeModel for the read-function and doc-indexer roles are owned by task 8.1.

  # -- S3 Vectors Provisioner Log Group --
  S3VectorsProvisionerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: EnableDocAiIsTrue
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-S3VectorsProvisioner'
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD, !Ref LogRetentionInDaysForDEVTEST]

  # -- S3 Vectors Provisioner Execution Role --
  # Least-privilege: CloudWatch Logs on its own log group, X-Ray write (Globals enables
  # tracing for all functions), and s3vectors CONTROL-plane actions scoped to the specific
  # vector bucket and the indexes within it. No data-plane actions are granted here.
  S3VectorsProvisionerRole:
    Type: AWS::IAM::Role
    Condition: EnableDocAiIsTrue
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-S3VectorsProvisionerRole"
      Description: "IAM Role for the S3 Vectors provisioner custom resource (control-plane create/delete only)"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']

      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      ManagedPolicyArns:
        # X-Ray write only (Globals sets Tracing: Active for every function). This is a
        # narrowly-scoped AWS-managed policy already used by the other roles in this stack.
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'

      Policies:
      - PolicyName: S3VectorsProvisionerResourceAccessPolicies
        PolicyDocument:
          Statement:

          - Sid: LambdaAccessToWriteLogs
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource: !GetAtt S3VectorsProvisionerLogGroup.Arn

          - Sid: S3VectorsBucketControlPlane
            # Bucket-level create/delete/get scoped to the one resolved bucket ARN by name
            # (CreateVectorBucket acts on a not-yet-existing bucket whose name is known).
            Action:
            - s3vectors:CreateVectorBucket
            - s3vectors:DeleteVectorBucket
            - s3vectors:GetVectorBucket
            Effect: Allow
            Resource:
            - !Sub
              - 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}'
              - VectorBucketName: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']

          - Sid: S3VectorsIndexControlPlane
            # >! Index actions are scoped to indexes WITHIN the specific vector bucket only.
            # >! index/* (rather than a fixed index name) is required so an index-name change
            # >! or an in-place replacement can create/delete under the same bucket without a
            # >! broader grant; this is still least-privilege at the bucket boundary.
            Action:
            - s3vectors:CreateIndex
            - s3vectors:DeleteIndex
            - s3vectors:GetIndex
            Effect: Allow
            Resource:
            - !Sub
              - 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/*'
              - VectorBucketName: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']

  # -- S3 Vectors Provisioner Lambda Function --
  # Small, dependency-light CloudFormation custom-resource handler. Bundles
  # @aws-sdk/client-s3vectors (the one justified SDK bundling per tasks 4.1/4.2 - the
  # client may not yet be in the nodejs24.x runtime). No Insights/SSM layers needed.
  S3VectorsProvisionerFunction:
    Type: AWS::Serverless::Function
    Condition: EnableDocAiIsTrue
    Properties:
      FunctionName: !Sub '${Prefix}-${ProjectId}-${StageId}-S3VectorsProvisioner'
      Description: "CloudFormation custom resource that provisions the S3 Vectors vector bucket + index (spec 0-0-6)"
      CodeUri: src/lambda/s3-vectors-provisioner/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - !Ref FunctionArchitecture
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt S3VectorsProvisionerRole.Arn

  # -- S3 Vectors Vector Bucket + Index (custom resource) --
  # Provisioned by S3VectorsProvisionerFunction. VectorBucketName/IndexName MUST match the
  # resolved expressions wired into the read-function/doc-indexer DOC_AI_S3_VECTOR_* env
  # vars (kept identical). Dimension/DistanceMetric/NonFilterableMetadataKeys are IMMUTABLE
  # in S3 Vectors; the provisioner replaces the index if they change. Filterable metadata
  # used at query time is version/type/subType (see layer vector-store-s3.js), so the
  # remaining metadata keys are declared non-filterable to save space. model/dims are
  # stored (non-filterable) so the doc-indexer can reuse unchanged embeddings across index
  # versions (Req 6.2), matching the DynamoDB store; non-filterable keys are still returned
  # by GetVectors/QueryVectors. 6 keys is within the provisioner's max of 10.
  DocAiVectorIndex:
    Type: Custom::S3VectorIndex
    Condition: EnableDocAiIsTrue
    Properties:
      ServiceToken: !GetAtt S3VectorsProvisionerFunction.Arn
      VectorBucketName: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']
      IndexName: !If [HasDocAiS3VectorIndexOverride, !Ref DocAiS3VectorIndex, !Sub '${Prefix}-${ProjectId}-${StageId}-docidx']
      Dimension: !Ref DocAiEmbeddingDimensions
      DistanceMetric: 'cosine'
      NonFilterableMetadataKeys:
        - hash
        - repository
        - owner
        - embeddingInputHash
        - model
        - dims

  # ---------------------------------------------------------------------------
  # Documentation AI (Semantic Search) - Runtime DATA-plane IAM
  # spec 0-0-6, task 8.1
  # ---------------------------------------------------------------------------
  # >! Least-privilege Bedrock + S3 Vectors DATA-plane permissions for the read-function
  # >! and doc-indexer. Delivered as two SEPARATE AWS::IAM::Policy resources attached to the
  # >! (always-created) execution roles, each gated by EnableDocAiIsTrue, so when the feature
  # >! is disabled (the default) NO Bedrock or S3 Vectors permissions exist on either role
  # >! (Req 8.1 - nothing granted when disabled). The provisioner section above owns only the
  # >! CONTROL-plane (create/delete vector bucket + index); these policies own the runtime
  # >! DATA-plane and bedrock:InvokeModel and never touch the DynamoDB statements (the
  # >! 'dynamodb' vector store keeps working via the existing DocIndex table grants).
  # >!
  # >! Scoping rules applied to BOTH policies (least privilege, no wildcards):
  # >!   - bedrock:InvokeModel is scoped to the SPECIFIC foundation-model ARN(s) built from
  # >!     the DocAiEmbeddingModel / DocAiAssistModel parameters - never a model wildcard.
  # >!     A foundation-model ARN carries NO account id (the '::' double colon is intentional).
  # >!   - s3vectors actions are scoped to the SINGLE resolved index ARN
  # >!     (bucket/<bucket>/index/<index>) - tighter than the provisioner's control-plane
  # >!     'index/*'. The bucket/index name expressions are byte-identical to the
  # >!     DocAiVectorIndex custom resource and the DOC_AI_S3_VECTOR_* env vars (kept in sync).
  # >!   - Each role gets ONLY the s3vectors commands its own code path issues (verified in
  # >!     layer nodejs/vector-store-s3.js): the read role gets Query only; the indexer gets
  # >!     write/reuse/cleanup only. Neither gets the other's actions.
  # >! Inference-profile handling:
  # >!   - ASSIST (cross-region IS supported): by default DocAiAssistProfileRegions is
  # >!     non-empty and DocAiAssistModel points at a cross-region INFERENCE-PROFILE id, so the
  # >!     assist grant in ReadDocAiPolicy broadens to the inference-profile ARN PLUS the
  # >!     underlying plain assist foundation model (DocAiAssistFoundationModel), clamped to
  # >!     exactly the listed regions via the aws:RequestedRegion condition key (AWS's documented
  # >!     cross-region inference IAM pattern - still model-pinned, no model wildcard). Setting
  # >!     DocAiAssistProfileRegions to empty reverts DocAiAssistModel to a plain on-demand
  # >!     foundation-model ARN with no condition (byte-identical to the pre-cross-region grant).
  # >!   - EMBEDDING still assumes an on-demand FOUNDATION model. Embedding models cannot use
  # >!     inference profiles, so cross-region embedding is handled by pointing the embedding
  # >!     client at DocAiEmbeddingRegion (a hard region pin), not by broadening this ARN.

  # -- Read Lambda DATA-plane policy (query embedding + assist re-rank + vector query) --
  ReadDocAiPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableDocAiIsTrue
    Properties:
      PolicyName: !Sub '${Prefix}-${ProjectId}-${StageId}-ReadDocAiAccess'
      Roles:
        - !Ref ReadLambdaExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # -- Embedding-model invoke (query embedding) --
          - Sid: BedrockInvokeQueryEmbeddingModel
            # >! read-function embeds the query with the embedding model, so InvokeModel is
            # >! scoped to the single embedding foundation-model ARN and nothing else. No account
            # >! id (the '::' double colon is intentional; foundation models are AWS-owned).
            # >! Region segment follows DocAiEmbeddingRegion when HasDocAiEmbeddingRegionOverride
            # >! is set, matching the runtime embedding-client region pin (DOC_AI_EMBEDDING_REGION)
            # >! so the grant covers the exact region of the actual InvokeModel call. Embedding
            # >! models cannot use cross-region inference profiles, hence a hard region pin rather
            # >! than the aws:RequestedRegion pattern used for assist. When the override is empty
            # >! (default) this is byte-identical to AWS::Region. Still model-pinned, no wildcard.
            Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - !If
              - HasDocAiEmbeddingRegionOverride
              - !Sub 'arn:aws:bedrock:${DocAiEmbeddingRegion}::foundation-model/${DocAiEmbeddingModel}'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${DocAiEmbeddingModel}'

          # -- Assist-model invoke (semantic-assisted re-rank), cross-region aware --
          # >! Cross-region assist scoping via AWS's documented aws:RequestedRegion pattern
          # >! (no Fn::ForEach, no AWS::LanguageExtensions transform - see the section header):
          # >!   - DocAiAssistProfileRegions EMPTY: a single plain assist foundation-model ARN
          # >!     keyed on DocAiAssistModel, no condition - byte-identical to the original
          # >!     grant (DocAiAssistModel is expected to be a plain foundation-model id here).
          # >!   - DocAiAssistProfileRegions NON-EMPTY (default): DocAiAssistModel is expected to
          # >!     be an INFERENCE-PROFILE id (e.g. the Geo-US default us.amazon.nova-micro-v1:0),
          # >!     and the grant becomes two statements - (1) the inference-profile ARN (keyed on
          # >!     DocAiAssistModel, the invoke id) and (2) the underlying plain assist foundation
          # >!     model (keyed on DocAiAssistFoundationModel, NOT DocAiAssistModel - the profile
          # >!     id is not a valid foundation-model ARN segment) via a region-wildcard ARN
          # >!     CLAMPED by aws:RequestedRegion to exactly the listed regions. Still model-pinned
          # >!     and least-privilege: no model wildcard, and the region wildcard is constrained
          # >!     by the condition to the operator-listed regions.
          # >! The two shapes are toggled by the existing HasDocAiAssistProfileRegions condition.
          - !If
            - HasDocAiAssistProfileRegions
            # Non-empty branch, statement 1 of 2: the inference-profile ARN itself, keyed on the
            # invoke id (DocAiAssistModel).
            # >! Unlike a foundation-model ARN, an inference-profile ARN carries BOTH region AND
            # >! account id (single colons around ${AWS::AccountId}) - it is an account-scoped,
            # >! regional resource. Model-pinned to the specific profile id, no wildcard.
            - Sid: BedrockInvokeAssistInferenceProfile
              Effect: Allow
              Action:
              - bedrock:InvokeModel
              Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${DocAiAssistModel}'
            # Empty branch: single plain assist foundation-model ARN, keyed on DocAiAssistModel
            # (expected to be a plain foundation-model id in this branch), no condition.
            # >! No account id (double colon). Byte-identical assist grant to the original behavior.
            - Sid: BedrockInvokeAssistModel
              Effect: Allow
              Action:
              - bedrock:InvokeModel
              Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${DocAiAssistModel}'

          - !If
            - HasDocAiAssistProfileRegions
            # Non-empty branch, statement 2 of 2: the plain assist foundation model the profile
            # routes to, keyed on DocAiAssistFoundationModel (NOT the invoke/profile id
            # DocAiAssistModel - a foundation-model ARN cannot resolve a profile id), region-
            # >! wildcarded but CLAMPED by aws:RequestedRegion to exactly the operator-listed
            # >! DocAiAssistProfileRegions (a CommaDelimitedList renders as the JSON array the
            # >! condition value expects). Omitted entirely in the empty branch.
            - Sid: BedrockInvokeAssistModelRegionClamped
              Effect: Allow
              Action:
              - bedrock:InvokeModel
              Resource:
              - !Sub 'arn:aws:bedrock:*::foundation-model/${DocAiAssistFoundationModel}'
              Condition:
                StringEquals:
                  aws:RequestedRegion: !Ref DocAiAssistProfileRegions
            # Empty (default) branch: this second statement does not exist.
            - !Ref 'AWS::NoValue'

          - Sid: S3VectorsQueryDataPlane
            # >! Query-only data-plane: the retrieval path calls VectorStore.query() which
            # >! issues QueryVectors AND GetVectors (layer vector-store-s3.js). The AWS SDK's
            # >! QueryVectorsCommand internally requires s3vectors:GetVectors when the call
            # >! requests returnMetadata/returnDistance (both true in vector-store-s3.js),
            # >! confirmed via AccessDeniedException on GetVectors when only QueryVectors was
            # >! granted. No Put/List/Delete for the read role. Scoped to the ONE resolved
            # >! index ARN (not index/*).
            Effect: Allow
            Action:
            - s3vectors:QueryVectors
            - s3vectors:GetVectors
            Resource:
            - !Sub
              - 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/${IndexName}'
              - VectorBucketName: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']
                IndexName: !If [HasDocAiS3VectorIndexOverride, !Ref DocAiS3VectorIndex, !Sub '${Prefix}-${ProjectId}-${StageId}-docidx']

  # -- Doc Indexer DATA-plane policy (content embedding + vector upsert/reuse/cleanup) --
  DocIndexerDocAiPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableDocAiIsTrue
    Properties:
      PolicyName: !Sub '${Prefix}-${ProjectId}-${StageId}-DocIndexerDocAiAccess'
      Roles:
        - !Ref DocIndexerExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          - Sid: BedrockInvokeContentEmbeddingModel
            # >! doc-indexer embeds CONTENT with the embedding model only; it never invokes the
            # >! assist model, so InvokeModel is scoped to the single embedding foundation-model
            # >! ARN (no account id -> double colon; no model wildcard). See the inference-profile
            # >! caveat in the section header above.
            # >! Region segment follows DocAiEmbeddingRegion when HasDocAiEmbeddingRegionOverride
            # >! is set, matching the runtime embedding-client region pin (DOC_AI_EMBEDDING_REGION)
            # >! so the grant covers the exact region of the actual InvokeModel call. When the
            # >! override is empty (default) this is byte-identical to AWS::Region. Still
            # >! model-pinned, no wildcard.
            Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - !If
              - HasDocAiEmbeddingRegionOverride
              - !Sub 'arn:aws:bedrock:${DocAiEmbeddingRegion}::foundation-model/${DocAiEmbeddingModel}'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${DocAiEmbeddingModel}'

          - Sid: S3VectorsWriteDataPlane
            # >! Write/reuse/cleanup data-plane for the index path (verified in layer
            # >! vector-store-s3.js): upsertVectors -> PutVectors; getVersionVectors (embedding
            # >! reuse across index versions, Req 6.2) -> ListVectors + GetVectors; deleteVersion
            # >! (superseded-version cleanup - S3 Vectors has no TTL) -> ListVectors +
            # >! DeleteVectors. No QueryVectors (the indexer never queries). Scoped to the ONE
            # >! resolved index ARN (not index/*).
            Effect: Allow
            Action:
            - s3vectors:PutVectors
            - s3vectors:GetVectors
            - s3vectors:ListVectors
            - s3vectors:DeleteVectors
            Resource:
            - !Sub
              - 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/${IndexName}'
              - VectorBucketName: !If [HasDocAiS3VectorBucketOverride, !Ref DocAiS3VectorBucket, !Sub '${Prefix}-${ProjectId}-${StageId}-docvec']
                IndexName: !If [HasDocAiS3VectorIndexOverride, !Ref DocAiS3VectorIndex, !Sub '${Prefix}-${ProjectId}-${StageId}-docidx']

  # -- Read Lambda Execution Role --
  # Minimal permissions: S3 GetObject/ListBucket/GetObjectVersion, DynamoDB read, SSM GetParameter

  ReadLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-${ProjectId}-${StageId}-ReadExecutionRole"
      Description: "IAM Role for Read Lambda with minimal read-only permissions"
      Path: !Ref RolePath
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]

      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [lambda.amazonaws.com]
          Action: sts:AssumeRole

      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy'
        - 'arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess'
        - !If
          - HasCacheDataStorageStack
          - Fn::ImportValue:
              'Fn::Sub': '${Prefix}-CacheDataManagedLambdaExecutionRolePolicy'
          - !Ref 'AWS::NoValue'

      Policies:
      - PolicyName: ReadLambdaResourceAccessPolicies
        PolicyDocument:
          Statement:

          - Sid: LambdaAccessToWriteLogs
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource: !GetAtt ReadLambdaLogGroup.Arn

          - Sid: LambdaAccessToSSMParameters
            Action:
            - ssm:DescribeParameters
            - ssm:GetParameters
            - ssm:GetParameter
            - ssm:GetParametersByPath
            Effect: Allow
            Resource: 
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}*"

          - Sid: S3ReadOnlyAccess
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            - s3:ListBucket
            - s3:ListBucketVersions
            - s3:GetBucketTagging
            Effect: Allow
            Resource:
            - !Sub "arn:aws:s3:::*" # TODO: Scope - CDK generated managed policy?
            - !Sub "arn:aws:s3:::*/*" # TODO: Scope

          - Sid: DynamoDBReadOnlyAccess
            Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            Effect: Allow
            Resource:
            - !If
              - HasCacheDataDynamoDbTableName
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CacheDataDynamoDbTableName}"
              - Fn::Sub:
                - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                - TableName:
                    Fn::ImportValue: !Sub '${Prefix}-CacheDataDynamoDbTable'

          - Sid: DynamoDBSessionsTableAccess
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Effect: Allow
            Resource:
            - !GetAtt DynamoDbSessions.Arn

          - Sid: DocIndexTableReadAccess
            Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            Effect: Allow
            Resource:
            - !GetAtt DocIndexTable.Arn

          - Sid: UsersTableAuthAccess
            Action:
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            Effect: Allow
            Resource:
            - !GetAtt UsersTable.Arn

  # -- Lambda permissions allowing API Gateway to Execute Read Lambda --

  ReadLambdaPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "${ReadLambdaFunction}"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  ReadLambdaPermissionLive:
    Type: "AWS::Lambda::Permission"
    Condition: IsProduction
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReadLambdaFunction.Alias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  # -- Log Group with retention policy --

  ReadLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: !If [IsProduction, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties: 
      LogGroupName: !Sub '/aws/lambda/${Prefix}-${ProjectId}-${StageId}-ReadFunction'
      RetentionInDays: !If [ IsProduction, !Ref LogRetentionInDaysForPROD,  !Ref LogRetentionInDaysForDEVTEST]

  # ---------------------------------------------------------------------------
  # Documentation AI (Semantic Search) usage/cost Metric Filters (spec 0-0-6, task 8.2)
  #
  # Surface Bedrock usage/cost signal for semantic-assisted mode so usage can be compared
  # per store/mode (design "Cost Controls": "optional CloudWatch metric filters ... per
  # store/mode"). They target the read-function log group because the query path emits the
  # matched lines (SemanticAssistedRetrieval, task 7.2). Metric filters are free and
  # low-risk, so they are gated ONLY on EnableDocAiIsTrue (NOT on PROD): when the feature is
  # off no filters are created (Req 8.1).
  #
  # >! The read-function runs with AWS_LAMBDA_LOG_FORMAT=text, so each log event is a TEXT
  # >! line (a fixed token/phrase plus embedded JSON), NOT a pure-JSON event. We therefore
  # >! use count-based literal/quoted-substring patterns, NOT JSON selector patterns
  # >! ($.totalTokens would never match). Numeric token values are intentionally NOT
  # >! extracted here; the stable "DOC_AI_USAGE {json}" line still carries the raw counts for
  # >! ad-hoc Logs Insights queries. Patterns are case-sensitive; phrases with
  # >! non-alphanumeric characters are double-quoted, and space-separated terms are ANDed.
  # >! VISIBILITY: the DOC_AI_USAGE line is emitted at the injected logger's INFO level
  # >! (doc-ai-common retrieval-strategy #logUsage, task 7.2), and cache-data's DebugAndLog
  # >! emits INFO when LOG_LEVEL=INFO (the PROD default for this function), so the DOC_AI_USAGE
  # >! usage/per-store metrics DO populate in PROD (where cost tracking matters) as well as in
  # >! DEV/TEST. The degrade line is WARN level and IS visible in PROD.
  # >! WIRING: the read-function documentation service constructs the retrieval strategies and
  # >! injects DebugAndLog into them (task 8.4), so these filters are active at runtime whenever
  # >! the AI feature is enabled and a semantic-assisted search runs.

  # COUNT of every successful semantic-assisted re-rank (usage/cost signal), any store.
  # Matches the stable USAGE_LOG_PREFIX token emitted by task 7.2.
  DocAiSemanticAssistedUsageMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: EnableDocAiIsTrue
    Properties:
      LogGroupName: !Ref ReadLambdaLogGroup
      FilterPattern: '"DOC_AI_USAGE"'
      MetricTransformations:
        - MetricNamespace: !Sub '${Prefix}-${ProjectId}/DocAi'
          MetricName: SemanticAssistedUsageCount
          MetricValue: '1'
          DefaultValue: 0

  # COUNT of semantic-assisted usage against the s3-vectors store (per-store comparison).
  # ANDs the usage token with the literal JSON substring "store":"s3-vectors".
  DocAiSemanticAssistedUsageS3VectorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: EnableDocAiIsTrue
    Properties:
      LogGroupName: !Ref ReadLambdaLogGroup
      FilterPattern: '"DOC_AI_USAGE" "\"store\":\"s3-vectors\""'
      MetricTransformations:
        - MetricNamespace: !Sub '${Prefix}-${ProjectId}/DocAi'
          MetricName: SemanticAssistedUsageS3Vectors
          MetricValue: '1'
          DefaultValue: 0

  # COUNT of semantic-assisted usage against the dynamodb store (per-store comparison).
  # ANDs the usage token with the literal JSON substring "store":"dynamodb".
  DocAiSemanticAssistedUsageDynamoDbMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: EnableDocAiIsTrue
    Properties:
      LogGroupName: !Ref ReadLambdaLogGroup
      FilterPattern: '"DOC_AI_USAGE" "\"store\":\"dynamodb\""'
      MetricTransformations:
        - MetricNamespace: !Sub '${Prefix}-${ProjectId}/DocAi'
          MetricName: SemanticAssistedUsageDynamoDb
          MetricValue: '1'
          DefaultValue: 0

  # COUNT of graceful-degrade events (assist re-rank failed -> fell back to plain semantic).
  # Matches the stable fragment of task 7.2's WARN degrade line (visible even in PROD).
  DocAiSemanticDegradeMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: EnableDocAiIsTrue
    Properties:
      LogGroupName: !Ref ReadLambdaLogGroup
      FilterPattern: '"assist re-rank failed"'
      MetricTransformations:
        - MetricNamespace: !Sub '${Prefix}-${ProjectId}/DocAi'
          MetricName: SemanticDegradeCount
          MetricValue: '1'
          DefaultValue: 0

  # ---------------------------------------------------------------------------
  # CloudWatch Alarms and Dashboards

  # -- Read Lambda Function Error Alarm --

  ReadLambdaErrorsAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms # Either PROD or ALWAYS - Check Conditions
    Properties:
      AlarmDescription: Read Lambda Function Error > 1
      MetricName: Errors
      Statistic: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      Period: 900
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReadLambdaFunction
      AlarmActions:
        - Ref: ReadLambdaErrorAlarmNotification

  # -- Read Lambda Function Notification for Error Alarm --

  ReadLambdaErrorAlarmNotification:
      Type: AWS::SNS::Topic
      Condition: CreateAlarms # Either PROD or ALWAYS - Check Conditions
      Properties: 
        DisplayName: !Sub 'AWS-Alarm-${Prefix}-${ProjectId}-${StageId}'
        FifoTopic: false
        Subscription:
          - Endpoint: !Ref AlarmNotificationEmail
            Protocol: 'email'

  # -- ApiGateway Error Alarm --

  ApiGatewayErrorsAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms # Either PROD or ALWAYS - Check Conditions
    Properties:
      AlarmDescription: API Gateway Error > 1
      MetricName: Errors
      Statistic: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      Period: 900
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: !Ref WebApi
      AlarmActions:
        - Ref: ApiGatewayErrorAlarmNotification

  # -- ApiGateway Notification for Error Alarm --

  ApiGatewayErrorAlarmNotification:
      Type: AWS::SNS::Topic
      Condition: CreateAlarms # Either PROD or ALWAYS - Check Conditions
      Properties: 
        DisplayName: !Sub 'AWS-Alarm-${Prefix}-${ProjectId}-${StageId}'
        FifoTopic: false
        Subscription:
          - Endpoint: !Ref AlarmNotificationEmail
            Protocol: 'email'

  # -- Read Lambda Function Latency Alarm --

  ReadLambdaLatencyAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms # Either PROD or ALWAYS - Check Conditions
    Properties:
      AlarmDescription: Read Lambda Function Duration > 5000ms
      MetricName: Duration
      Statistic: Average
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5000
      Period: 300
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReadLambdaFunction
      AlarmActions:
        - Ref: ReadLambdaErrorAlarmNotification
  
  # -- Doc Indexer Lambda Function Error Alarm --

  DocIndexerErrorsAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Condition: CreateAlarms
    Properties:
      AlarmDescription: Doc Indexer Lambda Function Error > 1
      MetricName: Errors
      Statistic: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      Period: 900
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref DocIndexerFunction
      AlarmActions:
        - Ref: DocIndexerErrorAlarmNotification

  # -- Doc Indexer Lambda Function Notification for Error Alarm --

  DocIndexerErrorAlarmNotification:
      Type: AWS::SNS::Topic
      Condition: CreateAlarms
      Properties:
        DisplayName: !Sub 'AWS-Alarm-${Prefix}-${ProjectId}-${StageId}-DocIndexer'
        FifoTopic: false
        Subscription:
          - Endpoint: !Ref AlarmNotificationEmail
            Protocol: 'email'

  # -- CloudWatch Dashboard --

  Fn::Transform:
    Name: AWS::Include
    Parameters:
      Location: ./template-dashboard.yml
      
# =============================================================================
# OUTPUTS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
#
# Place anything interesting that you would like to quickly refer to in 
# your cloudformation OUTPUT section. Test URLs, direct links to resources, etc
#

Outputs:

  # -- MCP Endpoint examples
  ApiEndpoint:
    Description: "MCP Server API Endpoint URL"
    Value: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiPathBase}/mcp/"

  # -- CloudWatch Log Groups
  CloudWatchReadLambdaExecutionLogGroup:
    Description: "Cloud Watch Log Group for Read Lambda Execution Logs"
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logStream:group=%2Faws%2Flambda%2F${ReadLambdaFunction}"

  CloudWatchApiGatewayExecutionLogGroup:
    Condition: ApiGatewayLoggingIsEnabled
    Description: "Cloud Watch Log Group for API Gateway Execution Logs"
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logStream:group=%2Faws%2Fapigateway%2FAPI-Gateway-Execution-Logs_${WebApi}/${ApiPathBase}"

  CloudWatchApiGatewayAccessLogGroup:
    Condition: ApiGatewayLoggingIsEnabled
    Description: "Cloud Watch Log Group for API Gateway Access Logs"
    Value: !Sub "https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logStream:group=%2Faws%2Fapigateway%2F${Prefix}-${ProjectId}-${StageId}-WebApi-access-logs"

  CloudWatchDashboard:
    Condition: CreateProdResources
    Description: "Cloud Watch Dashboard (for production environments only)"
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Prefix}-${ProjectId}-${StageId}-Dashboard'

  # -- Resource quick links
  ReadLambdaWebConsole:
    Description: "Read Lambda Web Console"
    Value: !Sub "https://console.aws.amazon.com/lambda/home?region=${AWS::Region}#/functions/${ReadLambdaFunction}?tab=code"

  ParameterStore:
    Description: "SSM Parameter Store"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/parameters/?region=${AWS::Region}&tab=Table#list_parameter_filters=Name:Contains:${ParameterStoreHierarchy}"