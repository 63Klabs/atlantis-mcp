openapi: '3.0.0'
info:
  title: "Atlantis MCP Server API"
  description: "Model Context Protocol server for Atlantis Templates and Scripts Platform - provides read-only operations for template discovery, starter code, and documentation search via JSON-RPC 2.0"
  version: "0.0.1"
  contact:
    name: "63klabs.net"
    url: "https://github.com/63klabs/atlantis-mcp"
  license:
    name: "Distributed on an AS IS BASIS"
    url: "https://github.com/63klabs/atlantis-mcp/blob/main/LICENSE.txt"

# =============================================================================
# PATHS - MCP Endpoints
# =============================================================================

paths:

  /mcp/v1:
    post:
      summary: "MCP JSON-RPC 2.0 endpoint"
      description: "JSON-RPC 2.0 endpoint for all MCP protocol operations including initialize, tools/list, and tools/call"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPRequest'
      responses:
        '200':
          description: "Success response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPResponse'
        '400':
          description: "Bad request - invalid JSON-RPC 2.0 message"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
      x-amazon-apigateway-integration:
        httpMethod: post
        type: aws_proxy
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReadLambdaFunction.Arn}/invocations

  /auth/key/regenerate:
    post:
      summary: "Regenerate API key"
      description: "Regenerate the authenticated user's API key. Requires a valid Cognito JWT in the Authorization header. Returns the new raw API key once."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: "Success - new API key returned"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: "Unauthorized - invalid or missing JWT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
      x-amazon-apigateway-integration:
        httpMethod: post
        type: aws_proxy
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLambdaFunction.Arn}/invocations

  /auth/profile:
    get:
      summary: "Get user profile"
      description: "Retrieve consolidated profile data for the authenticated user including email, tier, tier expiration, and real-time rate limit statistics. Requires a valid Cognito JWT in the Authorization header."
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "Cognito JWT bearer token"
          schema:
            type: string
            example: "Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: "Success - profile data returned"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: "Unauthorized - invalid or missing JWT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: "User not found - no user record for the authenticated email"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
      x-amazon-apigateway-integration:
        httpMethod: post
        type: aws_proxy
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLambdaFunction.Arn}/invocations

  /auth/voucher/redeem:
    post:
      summary: "Redeem a voucher code"
      description: "Redeem a promotion voucher code to upgrade the authenticated user's tier. Requires a valid Cognito JWT in the Authorization header."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: "Voucher code to redeem"
                  example: "SUMMER2025"
      responses:
        '200':
          description: "Success - tier updated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: "Bad request - invalid, expired, or fully redeemed voucher"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
        '401':
          description: "Unauthorized - invalid or missing JWT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
        '500':
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPError'
      x-amazon-apigateway-integration:
        httpMethod: post
        type: aws_proxy
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLambdaFunction.Arn}/invocations

# =============================================================================
# COMPONENTS - Reusable Schemas
# =============================================================================

components:

  schemas:

    # MCP Protocol Request Schema (JSON-RPC 2.0)
    MCPRequest:
      type: object
      required:
        - jsonrpc
        - method
        - id
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
          description: "JSON-RPC protocol version"
          example: "2.0"
        method:
          type: string
          description: "MCP method name to invoke (initialize, tools/list, tools/call)"
          example: "tools/call"
        params:
          type: object
          description: "Method-specific parameters (optional)"
          example:
            name: "list_templates"
            arguments:
              category: "storage"
        id:
          oneOf:
            - type: string
            - type: number
          description: "Unique request identifier"
          example: "req-123"

    # MCP Protocol Success Response Schema (JSON-RPC 2.0)
    MCPResponse:
      type: object
      required:
        - jsonrpc
        - result
        - id
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
          description: "JSON-RPC protocol version"
          example: "2.0"
        result:
          type: object
          description: "Method result data"
          example:
            content:
              - type: "text"
                text: '{"templates": [...]}'
        id:
          oneOf:
            - type: string
            - type: number
          description: "Request identifier matching the request"
          example: "req-123"

    # MCP Protocol Error Response Schema (JSON-RPC 2.0)
    MCPError:
      type: object
      required:
        - jsonrpc
        - error
        - id
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
          description: "JSON-RPC protocol version"
          example: "2.0"
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              description: "Error code (JSON-RPC standard codes)"
              example: -32600
            message:
              type: string
              description: "Human-readable error message"
              example: "Invalid Request"
            data:
              type: object
              description: "Additional error information (optional)"
              example:
                details: "Missing required parameter: namespace"
        id:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
          description: "Request identifier or null if request ID could not be determined"
          example: "req-123"

    # Auth Response Schema
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          description: "Human-readable status message"
          example: "API key regenerated successfully"
        apiKey:
          type: string
          description: "Raw API key (returned only on key generation/regeneration, shown once)"
          example: "atl_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
        tier:
          type: string
          description: "User's current tier after the operation"
          example: "paid"
        tierExpiresAt:
          type: string
          description: "ISO 8601 timestamp when the tier expires (null if no expiration)"
          example: "2025-12-31T00:00:00Z"

    # Auth Error Response Schema
    AuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "Human-readable error message"
          example: "Unauthorized"

    # Profile Response Schema
    ProfileResponse:
      type: object
      required:
        - email
        - tier
        - createdAt
        - rateLimits
      properties:
        email:
          type: string
          description: "Server-confirmed email from the Users Table"
          example: "user@example.com"
        tier:
          type: string
          description: "Effective tier accounting for expiration"
          enum:
            - registered
            - paid
            - private
          example: "registered"
        tierExpiresAt:
          type: string
          nullable: true
          description: "ISO 8601 timestamp when the tier expires, or null if permanent"
          example: "2025-12-31T00:00:00.000Z"
        createdAt:
          type: string
          description: "ISO 8601 timestamp when the account was created"
          example: "2025-01-15T10:30:00.000Z"
        rateLimits:
          type: object
          required:
            - limit
            - remaining
            - windowResetAt
            - windowMinutes
          properties:
            limit:
              type: number
              description: "Maximum requests per window for the effective tier"
              example: 100
            remaining:
              type: number
              description: "Requests remaining in the current window"
              example: 42
            windowResetAt:
              type: number
              description: "Unix epoch seconds when the current window resets"
              example: 1735689600
            windowMinutes:
              type: number
              description: "Window duration in minutes"
              example: 60
