version: 0.2

# BUILD ENVIRONMENT VARIABLES are specified in Pipeline template for CodeBuild
# You can view environment variables and values for this CodeBuild project:
# AWS Web Console >> CodeBuild >> Build >> Projects >> [this project] >> [build run] >> Environment Variables
# 
# You can also run the command `printenv`
#
# Use BUILD ENVIRONMENT VARIABLES as conditionals, customizations, or parameters/arguments for scripts

phases:
  install:
    runtime-versions:
      nodejs: latest
      python: latest
    commands:

      - ls -l -a

      # Build Environment information for debugging purposes
      - python3 --version
      - node --version
      - aws --version

      # We do not want to install dev dependencies in the application environment
      # You could move things around if you wanted to install dev dependencies in 
      # the build environment first to run tests or npm builds prior to deploying.
      # Then remove the installed packages, set the NODE_ENV to production, and 
      # install the production dependencies before deploying artifacts.
      # Dev dependencies should not be installed in the application environment.
      - echo "NODE_ENV is $NODE_ENV"

      # Configure pip cache directory
      - mkdir -p /root/.cache/pip
      - pip config set global.cache-dir /root/.cache/pip

      # Set npm caching (This 'offline' cache is still tar zipped, but it helps.) - https://blog.mechanicalrock.io/2019/02/03/monorepos-aws-codebuild.html
      - npm config -g set prefer-offline true
      - npm config -g set cache /root/.npm
      - npm config get cache

      # Build Environment: Install Python dependencies for Build Scripts if build-scripts/requirements.txt exists
      - |
        if [ -f "build-scripts/requirements.txt" ]; then
          echo "Installing Python dependencies for build scripts"
          pip install -r build-scripts/requirements.txt
        else
          echo "No build-scripts/requirements.txt found, skipping pip install"
        fi


  pre_build:
    commands:

      - ls -l -a

      # Application Environment: Build and test each Lambda function independently.
      # src/lambda/ holds one directory per function (multi-src layout). Each function
      # is fully self-contained with its own package.json, .nvmrc, and node_modules.
      # The loop picks up new functions automatically - no buildspec changes needed
      # when a function is added. The layers/ subdirectory is handled separately below.
      - echo "--- Building Lambda Functions ---"
      - |
        for func_dir in application-infrastructure/src/lambda/*/; do
          # Skip the layers directory (built separately)
          if [ "$(basename "$func_dir")" = "layers" ]; then
            continue
          fi

          echo "Processing function: $func_dir"
          cd "$CODEBUILD_SRC_DIR/$func_dir"

          # Install dev so we can run tests, but we will remove dev dependencies later
          npm install --include=dev
          # Run Test under test environment
          NODE_ENV=test npm test

          # Clean up test artifacts and reinstall only production dependencies to reduce Lambda package size
          rm -rf __tests__ tests coverage node_modules
          npm install --omit=dev

          # FAIL the build if npm audit has vulnerabilities it can't fix
          # Perform a fix to move us forward, then check to make sure there were no unresolved high fixes
          # We are making an intentional choice here:
          #     Make breaking changes in hopes to bring vulnerabilities to 0
          #      vs deploying packages with vulnerabilities
          npm audit fix --force --omit=dev
          # Gate on production dependencies only. Dev dependencies (jest, babel, etc.)
          # are removed above and never deployed, so their advisories must not fail the
          # build. This matches the --omit=dev scope of the audit fix on the line above.
          npm audit --omit=dev --audit-level=high

          cd "$CODEBUILD_SRC_DIR"
        done

      # Build Lambda Layers (production dependencies only) if any exist
      - echo "--- Building Lambda Layers ---"
      - |
        if [ -d "application-infrastructure/src/lambda/layers" ]; then
          for layer_dir in application-infrastructure/src/lambda/layers/*/; do
            if [ -d "$layer_dir" ]; then
              echo "Processing layer: $layer_dir"
              cd "$CODEBUILD_SRC_DIR/$layer_dir"

              # Install dev so we can run tests, but we will remove dev dependencies later
              npm install --include=dev
              # Run Test under test environment
              NODE_ENV=test npm test

              # Clean up test artifacts and reinstall only production dependencies to reduce Lambda package size
              rm -rf __tests__ tests coverage node_modules
              npm install --omit=dev

              # FAIL the build if npm audit has vulnerabilities it can't fix
              # Perform a fix to move us forward, then check to make sure there were no unresolved high fixes
              npm audit fix --force --omit=dev
              # Gate on production dependencies only (dev deps are removed and never
              # deployed); matches the --omit=dev scope of the audit fix above.
              npm audit --omit=dev --audit-level=high

              cd "$CODEBUILD_SRC_DIR"
            fi
          done
        fi

      # Continue with existing build-scripts (SSM, etc.) from application-infrastructure.
      # The loop above ends at $CODEBUILD_SRC_DIR (repo root), so return to the
      # application-infrastructure directory before running the build scripts.
      - cd "$CODEBUILD_SRC_DIR/application-infrastructure"

      # Generate a random 256 bit key (hexidecimal) in SSM for cache data:
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}CacheData_SecureDataKey --generate 256
      # Save a spot for GitHub Token
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}GitHubToken
      # Generate a random 256 bit hash (hexidecimal) in SSM for the Session Rate Client Identifier Key
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_SessionHashSalt --generate 256

      # Auth: Generate a random 256 bit key (hexidecimal) in SSM for API key HMAC hashing
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_ApiKeyHashSalt --generate 256
      # Auth: Domain and country restriction parameters (BLANK = no restrictions)
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_AllowedPrivateDomains --value "BLANK"
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_BlockedEmailDomains --value "BLANK"
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_AllowedEmailDomains --value "BLANK"
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_BlockedCountries --value "BLANK"
      - python3 ./build-scripts/generate-put-ssm.py ${PARAM_STORE_HIERARCHY}Mcp_AllowedCountries --value "BLANK"


  build:
    commands:

      # Each CodeBuild phase may reset the working directory to $CODEBUILD_SRC_DIR
      # (repo root). Ensure the build scripts below run from application-infrastructure.
      - cd "$CODEBUILD_SRC_DIR/application-infrastructure"

      # There is sometimes a bug that causes the alias to not be updated correctly (see comment in template.yml for AppFunction.Properties.AutoPublishCodeSha256)
      - python3 ./build-scripts/update_template_timestamp.py template.yml

      # Replace placeholders in the template-configuration.json file
      - python3 ./build-scripts/update_template_configuration.py template-configuration.json

      # Use CloudFormation to package the application infrastructure and code that was placed in the S3 Deploy Bucket
      - aws cloudformation package --template template.yml --s3-bucket $S3_ARTIFACTS_BUCKET --output-template template-export.yml

      # You can add additional tags and parameters to template-configuration.json

      # list files in the artifacts
      - ls -l -a

  post_build:
    commands:
      # Report build status
      - echo "Build completed successfully"

artifacts:
  files:
    - 'application-infrastructure/**/*'

# add cache
cache:
  paths:
    - '/root/.npm/**/*'
    - '/root/.cache/pip/**/*'
